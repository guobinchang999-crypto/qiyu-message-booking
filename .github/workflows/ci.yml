# Validate changed components on pull requests and package one selected component
# when a developer starts the workflow manually.
name: Qiyu CI Pipeline

on:
  # Pull requests run checks only for affected components.
  pull_request:
    paths:
      - 'qiyu-server/**'
      - 'qiyu-admin-pro/**'
      - 'qiyu-client/**'
      - '.github/workflows/ci.yml'

  # Manual runs expose a component selector and an optional checks flag.
  workflow_dispatch:
    inputs:
      component:
        description: 'Select component to build'
        required: true
        default: 'Java Backend'
        type: choice
        options:
          - 'Java Backend'
          - 'Admin Console'
          - 'WeChat Mini Program'
      run_checks:
        description: 'Run tests and quality checks (always enabled on main)'
        required: false
        default: true
        type: boolean

# Build jobs only need read access. The result job receives write access
# separately because successful main builds create release tags.
permissions:
  contents: read

# Serialize manual builds of the same component because Snapshot tags are
# mutable. Pull request runs remain isolated by Git reference.
concurrency:
  group: qiyu-ci-${{ inputs.component || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  # Replace Docker's generated report and build-record artifact with the concise
  # Build Result summary at the end of this workflow.
  DOCKER_BUILD_SUMMARY: 'false'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  # Resolve component selection and enforcement policy once for all build jobs.
  plan:
    name: Plan Build
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.plan.outputs.server }}
      admin: ${{ steps.plan.outputs.admin }}
      client: ${{ steps.plan.outputs.client }}
      checks: ${{ steps.plan.outputs.checks }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      # Full history is required for pull request diffs and release-tag checks.
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Manual runs select one component. Pull requests derive all affected
      # components from changed files. Main and pull request runs force checks.
      - name: Resolve Build Plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_COMPONENT: ${{ inputs.component }}
          INPUT_CHECKS: ${{ inputs.run_checks }}
        run: |
          set -euo pipefail

          server=false
          admin=false
          client=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$INPUT_COMPONENT" in
              'Java Backend') server=true ;;
              'Admin Console') admin=true ;;
              'WeChat Mini Program') client=true ;;
              *)
                echo "::error::Unsupported build component: $INPUT_COMPONENT"
                exit 1
                ;;
            esac
          else
            while IFS= read -r changed_file; do
              case "$changed_file" in
                qiyu-server/*) server=true ;;
                qiyu-admin-pro/*) admin=true ;;
                qiyu-client/*) client=true ;;
                .github/workflows/ci.yml)
                  server=true
                  admin=true
                  client=true
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi

          release=false
          checks=false
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            checks=true
          elif [[ "$REF_NAME" == "main" ]]; then
            release=true
            checks=true
          elif [[ "${INPUT_CHECKS:-false}" == "true" ]]; then
            checks=true
          fi

          {
            echo "server=$server"
            echo "admin=$admin"
            echo "client=$client"
            echo "checks=$checks"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  # Build the Spring Boot backend. Pull requests stop after verification, while
  # manual runs publish a versioned container image to GHCR.
  server:
    name: Build Java Backend
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      image: ${{ steps.image.outputs.image }}
      package_url: ${{ steps.image.outputs.package_url }}
      digest: ${{ steps.build.outputs.digest }}
    defaults:
      run:
        working-directory: qiyu-server
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Maven uses JDK 21 and a dependency cache keyed from pom.xml.
      - name: Set Up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Source versions remain X.Y.Z. Non-main builds add only the predictable
      # Snapshot suffix required by the future CD workflow.
      - name: Resolve Application Version
        id: version
        shell: bash
        env:
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          set -euo pipefail
          version="$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::qiyu-server/pom.xml version must use X.Y.Z format. Current value: $version"
            exit 1
          fi

          package_version="$version"
          if [[ "$RELEASE" != "true" ]]; then
            package_version="${version}-SNAPSHOT"
          fi
          release_tag="qiyu-server-v${version}"

          if [[ "$RELEASE" == "true" ]] && git rev-parse --verify --quiet "refs/tags/$release_tag" >/dev/null; then
            echo "::error::Release tag $release_tag already exists. Increment the Maven version before releasing again."
            exit 1
          fi

          {
            echo "package_version=$package_version"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      # Checks are optional on non-main manual builds and mandatory elsewhere.
      - name: Run Unit Tests
        if: needs.plan.outputs.checks == 'true'
        run: mvn -B test

      # Pull requests prove that the application can be packaged without using
      # registry credentials or publishing an artifact.
      - name: Verify Application Package
        if: github.event_name == 'pull_request'
        run: mvn -B -DskipTests package

      # Fail before an expensive Docker build when repository settings are absent.
      - name: Validate GHCR Credentials
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          for name in GHCR_USERNAME GHCR_PAT; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured in repository Actions Variables or Secrets."
              exit 1
            fi
          done

      - name: Set Up Docker Buildx
        if: github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4

      # Credentials are used only for the registry session and never enter the
      # Docker build context or final image.
      - name: Authenticate to GHCR
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      # GHCR image paths are lowercase. The package URL becomes useful after the
      # OCI source label associates the image with this repository.
      - name: Resolve Container Image
        if: github.event_name == 'workflow_dispatch'
        id: image
        shell: bash
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          image_owner="$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${image_owner}/qiyu-server:${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          # Personal-account GHCR packages use the /users/.../packages/container/package/... page.
          echo "package_url=${GITHUB_SERVER_URL}/users/${IMAGE_OWNER}/packages/container/package/qiyu-server" >> "$GITHUB_OUTPUT"

      # Release image tags are immutable; Snapshot tags intentionally overwrite.
      - name: Verify Release Version Is Available
        if: needs.plan.outputs.release == 'true'
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::Release image $IMAGE already exists. Increment the Maven version before releasing again."
            exit 1
          fi

      # The Dockerfile compiles with Maven on JDK 21 and copies only the runnable
      # JAR into the final Java 21 runtime image.
      - name: Build and Push Container Image
        if: github.event_name == 'workflow_dispatch'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: qiyu-server
          file: qiyu-server/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.package_version }}
          cache-from: type=gha,scope=qiyu-server
          cache-to: type=gha,mode=max,scope=qiyu-server

  # Build the Vue admin console. Pull requests run dependency, type, and
  # production-build checks without publishing an image.
  admin:
    name: Build Admin Console
    needs: plan
    if: needs.plan.outputs.admin == 'true'
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      image: ${{ steps.image.outputs.image }}
      package_url: ${{ steps.image.outputs.package_url }}
      digest: ${{ steps.build.outputs.digest }}
    defaults:
      run:
        working-directory: qiyu-admin-pro
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: qiyu-admin-pro/package-lock.json

      # package.json is the source of truth and package-lock.json must match it.
      - name: Resolve Application Version
        id: version
        shell: bash
        env:
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::qiyu-admin-pro/package.json version must use X.Y.Z format. Current value: $version"
            exit 1
          fi
          if [[ "$version" != "$lock_version" ]]; then
            echo "::error::package.json version ($version) does not match package-lock.json version ($lock_version)."
            exit 1
          fi

          package_version="$version"
          if [[ "$RELEASE" != "true" ]]; then
            package_version="${version}-SNAPSHOT"
          fi
          release_tag="qiyu-admin-v${version}"

          if [[ "$RELEASE" == "true" ]] && git rev-parse --verify --quiet "refs/tags/$release_tag" >/dev/null; then
            echo "::error::Release tag $release_tag already exists. Increment the admin version before releasing again."
            exit 1
          fi

          {
            echo "package_version=$package_version"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Checks
        if: needs.plan.outputs.checks == 'true'
        run: npm run typecheck

      - name: Verify Production Build
        if: needs.plan.outputs.checks == 'true'
        run: npm run build

      - name: Validate GHCR Credentials
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          for name in GHCR_USERNAME GHCR_PAT; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured in repository Actions Variables or Secrets."
              exit 1
            fi
          done

      - name: Set Up Docker Buildx
        if: github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Resolve Container Image
        if: github.event_name == 'workflow_dispatch'
        id: image
        shell: bash
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          image_owner="$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${image_owner}/qiyu-admin:${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          # Personal-account GHCR packages use the /users/.../packages/container/package/... page.
          echo "package_url=${GITHUB_SERVER_URL}/users/${IMAGE_OWNER}/packages/container/package/qiyu-admin" >> "$GITHUB_OUTPUT"

      - name: Verify Release Version Is Available
        if: needs.plan.outputs.release == 'true'
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::Release image $IMAGE already exists. Increment the admin version before releasing again."
            exit 1
          fi

      # The existing multi-stage Dockerfile copies only compiled static assets
      # into the final web-server image.
      - name: Build and Push Container Image
        if: github.event_name == 'workflow_dispatch'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: qiyu-admin-pro
          file: qiyu-admin-pro/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.package_version }}
          cache-from: type=gha,scope=qiyu-admin
          cache-to: type=gha,mode=max,scope=qiyu-admin

  # Compile and package the WeChat Mini Program as a downloadable GitHub
  # Artifact. This component does not publish a container image.
  client:
    name: Build WeChat Mini Program
    needs: plan
    if: needs.plan.outputs.client == 'true'
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      artifact_name: ${{ steps.archive.outputs.artifact_name }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    defaults:
      run:
        working-directory: qiyu-client
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: qiyu-client/package-lock.json

      - name: Resolve Application Version
        id: version
        shell: bash
        env:
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::qiyu-client/package.json version must use X.Y.Z format. Current value: $version"
            exit 1
          fi
          if [[ "$version" != "$lock_version" ]]; then
            echo "::error::package.json version ($version) does not match package-lock.json version ($lock_version)."
            exit 1
          fi

          package_version="$version"
          if [[ "$RELEASE" != "true" ]]; then
            package_version="${version}-SNAPSHOT"
          fi
          release_tag="qiyu-client-v${version}"

          if [[ "$RELEASE" == "true" ]] && git rev-parse --verify --quiet "refs/tags/$release_tag" >/dev/null; then
            echo "::error::Release tag $release_tag already exists. Increment the Mini Program version before releasing again."
            exit 1
          fi

          {
            echo "package_version=$package_version"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        run: npm ci

      # Materialize WeChat npm dependencies before archiving compiled output.
      - name: Build Mini Program Dependencies
        run: npm run build:miniprogram-npm

      - name: Run Quality Checks
        if: needs.plan.outputs.checks == 'true'
        run: npm run verify

      - name: Compile Mini Program
        if: needs.plan.outputs.checks != 'true'
        run: npm run build:miniprogram-js

      # Exclude local caches, private settings, and node_modules while retaining
      # everything required for import into WeChat DevTools.
      - name: Create Distribution Archive
        if: github.event_name == 'workflow_dispatch'
        id: archive
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail
          artifact_name="qiyu-client-${PACKAGE_VERSION}"
          mkdir -p ../artifacts
          zip -qr "../artifacts/${artifact_name}.zip" \
            miniprogram \
            project.config.json \
            package.json \
            package-lock.json \
            tsconfig.json \
            README.md \
            -x '*/.DS_Store' '*/project.private.config.json' '*/.wechatide.*'
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      # The upload action returns the direct download URL and SHA-256 digest used
      # in the final result summary.
      - name: Upload Distribution Artifact
        if: github.event_name == 'workflow_dispatch'
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.artifact_name }}
          path: artifacts/${{ steps.archive.outputs.artifact_name }}.zip
          if-no-files-found: error
          retention-days: 30

  # Every manual run reaches this job, even if the component build fails. It
  # creates main release tags only after a successful package publication and
  # writes one actionable report for developers and the future CD workflow.
  result:
    name: Build Result
    needs: [plan, server, admin, client]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Git history is required when a successful main build creates a release tag.
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Select component outputs, validate upstream status, create a release tag
      # when applicable, and produce the single final user-facing summary.
      - name: Publish Build Result
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          PLAN_RESULT: ${{ needs.plan.result }}
          RELEASE: ${{ needs.plan.outputs.release }}
          SERVER_RESULT: ${{ needs.server.result }}
          SERVER_VERSION: ${{ needs.server.outputs.package_version }}
          SERVER_RELEASE_TAG: ${{ needs.server.outputs.release_tag }}
          SERVER_IMAGE: ${{ needs.server.outputs.image }}
          SERVER_PACKAGE_URL: ${{ needs.server.outputs.package_url }}
          SERVER_DIGEST: ${{ needs.server.outputs.digest }}
          ADMIN_RESULT: ${{ needs.admin.result }}
          ADMIN_VERSION: ${{ needs.admin.outputs.package_version }}
          ADMIN_RELEASE_TAG: ${{ needs.admin.outputs.release_tag }}
          ADMIN_IMAGE: ${{ needs.admin.outputs.image }}
          ADMIN_PACKAGE_URL: ${{ needs.admin.outputs.package_url }}
          ADMIN_DIGEST: ${{ needs.admin.outputs.digest }}
          CLIENT_RESULT: ${{ needs.client.result }}
          CLIENT_VERSION: ${{ needs.client.outputs.package_version }}
          CLIENT_RELEASE_TAG: ${{ needs.client.outputs.release_tag }}
          CLIENT_ARTIFACT_NAME: ${{ needs.client.outputs.artifact_name }}
          CLIENT_ARTIFACT_URL: ${{ needs.client.outputs.artifact_url }}
          CLIENT_ARTIFACT_DIGEST: ${{ needs.client.outputs.artifact_digest }}
        run: |
          set -euo pipefail

          write_failure_summary() {
            local reason="$1"
            {
              echo "# Build Failed :x:"
              echo
              echo "| Field | Value |"
              echo "| --- | --- |"
              echo "| Status | Failed |"
              echo "| Component | \`$COMPONENT\` |"
              echo "| Branch | \`$BRANCH\` |"
              echo "| Commit | [\`${COMMIT_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA}) |"
              echo "| Reason | $reason |"
              echo "| Workflow Run | [Open run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$reason"
            exit 1
          }

          if [[ "$PLAN_RESULT" != "success" ]]; then
            write_failure_summary "The build plan could not be resolved."
          fi

          result=""
          package_version=""
          release_tag=""
          image=""
          package_url=""
          digest=""
          artifact_name=""
          artifact_url=""
          artifact_digest=""

          case "$COMPONENT" in
            'Java Backend')
              result="$SERVER_RESULT"
              package_version="$SERVER_VERSION"
              release_tag="$SERVER_RELEASE_TAG"
              image="$SERVER_IMAGE"
              package_url="$SERVER_PACKAGE_URL"
              digest="$SERVER_DIGEST"
              ;;
            'Admin Console')
              result="$ADMIN_RESULT"
              package_version="$ADMIN_VERSION"
              release_tag="$ADMIN_RELEASE_TAG"
              image="$ADMIN_IMAGE"
              package_url="$ADMIN_PACKAGE_URL"
              digest="$ADMIN_DIGEST"
              ;;
            'WeChat Mini Program')
              result="$CLIENT_RESULT"
              package_version="$CLIENT_VERSION"
              release_tag="$CLIENT_RELEASE_TAG"
              artifact_name="$CLIENT_ARTIFACT_NAME"
              artifact_url="$CLIENT_ARTIFACT_URL"
              artifact_digest="$CLIENT_ARTIFACT_DIGEST"
              ;;
            *)
              write_failure_summary "Unsupported build component: $COMPONENT"
              ;;
          esac

          if [[ "$result" != "success" ]]; then
            write_failure_summary "$COMPONENT build did not complete successfully. Upstream result: $result"
          fi
          if [[ -z "$package_version" ]]; then
            write_failure_summary "$COMPONENT did not return a package version."
          fi

          if [[ "$COMPONENT" == "WeChat Mini Program" ]]; then
            if [[ -z "$artifact_name" || -z "$artifact_url" || -z "$artifact_digest" ]]; then
              write_failure_summary "The Mini Program build did not return complete artifact metadata."
            fi
          elif [[ -z "$image" || -z "$package_url" || -z "$digest" ]]; then
            write_failure_summary "$COMPONENT did not return complete container image metadata."
          fi

          # Re-check immediately before creation to protect against an external
          # release racing with this workflow.
          if [[ "$RELEASE" == "true" ]]; then
            git fetch --force --tags origin
            if git rev-parse --verify --quiet "refs/tags/$release_tag" >/dev/null; then
              write_failure_summary "Release tag $release_tag already exists."
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$release_tag" "$COMMIT_SHA" -m "Release $release_tag"
            if ! git push origin "refs/tags/$release_tag"; then
              write_failure_summary "Failed to push release tag $release_tag."
            fi
          fi

          {
            echo "# Build Succeeded :white_check_mark:"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Status | Success |"
            echo "| Component | \`$COMPONENT\` |"
            echo "| Branch | \`$BRANCH\` |"
            echo "| Commit | [\`${COMMIT_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA}) |"
            echo "| Package Version | \`$package_version\` |"
            if [[ "$RELEASE" == "true" ]]; then
              echo "| Release Tag | \`$release_tag\` |"
            fi

            if [[ "$COMPONENT" == "WeChat Mini Program" ]]; then
              echo "| Artifact | [\`$artifact_name\`]($artifact_url) |"
              echo "| Artifact Digest | \`$artifact_digest\` |"
              echo "| Retention | 30 days |"
            else
              image_repository="${image%:*}"
              immutable_image="${image_repository}@${digest}"
              echo "| Container Image | \`$image\` |"
              echo "| Immutable Image | \`$immutable_image\` |"
              echo "| Image Digest | \`$digest\` |"
              echo "| GHCR Package | [Open package]($package_url) |"
              echo
              echo "## Pull Image"
              echo
              echo '```bash'
              echo "docker pull $image"
              echo '```'
              if [[ "$package_version" == *-SNAPSHOT ]]; then
                echo
                echo "> Snapshot tags are mutable. Use the immutable image reference above when CD must deploy this exact build."
              fi
            fi
            echo
            echo "[Open workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Build completed successfully: $COMPONENT $package_version"
