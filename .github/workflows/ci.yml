# This caller owns the Qiyu-specific manual UI. All build implementation lives
# in the versioned private github-pipelines repository.
name: Qiyu CI Pipeline

run-name: Build ${{ inputs.component || 'changed components' }} from ${{ github.ref_name }}

on:
  pull_request:
    paths:
      - 'qiyu-server/**'
      - 'qiyu-admin-pro/**'
      - 'qiyu-client/**'
      - '.github/pipeline/project.yml'
      - '.github/workflows/ci.yml'

  workflow_dispatch:
    inputs:
      component:
        description: 'Select component to build'
        required: true
        default: 'Java Backend'
        type: choice
        options:
          - 'Java Backend'
          - 'Admin Console'
          - 'WeChat Mini Program'
      run_checks:
        description: 'Run tests and quality checks (always enabled on main)'
        required: false
        default: true
        type: boolean

# The reusable workflow narrows permissions per job. These are the maximum
# permissions it may request for GHCR publishing, Artifacts and release tags.
permissions:
  contents: read

jobs:
  pipeline:
    name: Run Reusable CI
    permissions:
      contents: write
      packages: write
      actions: write
    uses: guobinchang999-crypto/github-pipelines/.github/workflows/ci.yml@v1
    with:
      component: ${{ inputs.component || 'auto' }}
      run_checks: ${{ inputs.run_checks || false }}
      config_path: .github/pipeline/project.yml
