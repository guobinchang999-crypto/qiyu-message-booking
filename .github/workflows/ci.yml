name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: qiyu-server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qiyu-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests (H2 mock profile)
        run: mvn -B test
      - name: Verify Flyway migrations are forward-compatible
        run: mvn -B -DskipTests package

  admin:
    name: qiyu-admin-pro typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qiyu-admin-pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qiyu-admin-pro/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  client:
    name: qiyu-client verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qiyu-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qiyu-client/package-lock.json
      - run: npm ci
      - run: npm run verify
