name: qiyu-admin-pro

on:
  push:
    branches: [main]
    paths:
      - 'qiyu-admin-pro/**'
      - '.github/workflows/qiyu-admin-pro.yml'
  pull_request:
    paths:
      - 'qiyu-admin-pro/**'
      - '.github/workflows/qiyu-admin-pro.yml'
  workflow_dispatch:

concurrency:
  group: qiyu-admin-pro-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ADMIN_DIR: qiyu-admin-pro
  IMAGE_NAME: qiyu-admin
  CONTAINER_NAME: qiyu-admin
  CONTAINER_PORT: '80'
  RESTART_POLICY: unless-stopped
  HEALTH_TIMEOUT_SECONDS: '120'

jobs:
  ci:
    name: Node CI (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qiyu-admin-pro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qiyu-admin-pro/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

  deploy:
    name: Build image and deploy to VM
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_DOCKER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compute image reference
        id: meta
        env:
          REGISTRY: ${{ vars.ACR_DOCKER_REGISTRY }}
          NAMESPACE: ${{ vars.ACR_NAMESPACE }}
        run: echo "image=${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.ADMIN_DIR }}
          file: ${{ env.ADMIN_DIR }}/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=qiyu-admin
          cache-to: type=gha,mode=max,scope=qiyu-admin

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_FULL_NAME: ${{ steps.meta.outputs.image }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
          HOST_PORT: ${{ vars.ADMIN_HOST_PORT }}
          RESTART_POLICY: ${{ env.RESTART_POLICY }}
          HEALTH_TIMEOUT_SECONDS: ${{ env.HEALTH_TIMEOUT_SECONDS }}
          ACR_DOCKER_REGISTRY: ${{ vars.ACR_DOCKER_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_FULL_NAME,CONTAINER_NAME,CONTAINER_PORT,HOST_PORT,RESTART_POLICY,HEALTH_TIMEOUT_SECONDS,ACR_DOCKER_REGISTRY,ACR_USERNAME,ACR_PASSWORD
          script: |
            set -eu
            : "$IMAGE_FULL_NAME"
            DOCKER_CONFIG=$(mktemp -d)
            export DOCKER_CONFIG
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            printf '%s' "$ACR_PASSWORD" | docker login --username "$ACR_USERNAME" --password-stdin "$ACR_DOCKER_REGISTRY"
            docker pull "$IMAGE_FULL_NAME"
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart "$RESTART_POLICY" \
              -p "${HOST_PORT:-8081}:$CONTAINER_PORT" \
              "$IMAGE_FULL_NAME"
            deadline=$(( $(date +%s) + HEALTH_TIMEOUT_SECONDS ))
            while :; do
              if [ -n "$(docker ps --filter "name=$CONTAINER_NAME" --filter health=healthy --quiet)" ]; then
                echo "container is healthy"
                break
              fi
              if [ -z "$(docker ps --filter "name=$CONTAINER_NAME" --quiet)" ]; then
                echo "container is not running" >&2
                docker logs --tail 100 "$CONTAINER_NAME" >&2 || true
                exit 1
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "health check timed out after $HEALTH_TIMEOUT_SECONDS seconds" >&2
                docker logs --tail 100 "$CONTAINER_NAME" >&2 || true
                exit 1
              fi
              sleep 5
            done
