name: qiyu-server

on:
  push:
    branches: [main]
    paths:
      - 'qiyu-server/**'
      - '.github/workflows/qiyu-server.yml'
  pull_request:
    paths:
      - 'qiyu-server/**'
      - '.github/workflows/qiyu-server.yml'
  workflow_dispatch:

concurrency:
  group: qiyu-server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: qiyu-server
  SERVER_DIR: qiyu-server
  CONTAINER_NAME: qiyu-server
  CONTAINER_PORT: '8080'
  RESTART_POLICY: unless-stopped
  HEALTH_TIMEOUT_SECONDS: '180'

jobs:
  ci:
    name: Java CI (test + package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qiyu-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests (H2 mock profile)
        run: mvn -B test

      - name: Verify Flyway migrations are forward-compatible
        run: mvn -B -DskipTests package

  deploy:
    name: Build image and deploy to VM
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_DOCKER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compute image reference
        id: meta
        env:
          REGISTRY: ${{ vars.ACR_DOCKER_REGISTRY }}
          NAMESPACE: ${{ vars.ACR_NAMESPACE }}
        run: echo "image=${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVER_DIR }}
          file: ${{ env.SERVER_DIR }}/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=qiyu-server
          cache-to: type=gha,mode=max,scope=qiyu-server

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_FULL_NAME: ${{ steps.meta.outputs.image }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
          HOST_PORT: ${{ vars.HOST_PORT }}
          RESTART_POLICY: ${{ env.RESTART_POLICY }}
          HEALTH_TIMEOUT_SECONDS: ${{ env.HEALTH_TIMEOUT_SECONDS }}
          ACR_DOCKER_REGISTRY: ${{ vars.ACR_DOCKER_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          SPRING_PROFILE: ${{ vars.SPRING_PROFILE }}
          QIYU_DB_URL: ${{ secrets.QIYU_DB_URL }}
          QIYU_DB_USERNAME: ${{ secrets.QIYU_DB_USERNAME }}
          QIYU_DB_PASSWORD: ${{ secrets.QIYU_DB_PASSWORD }}
          QIYU_REDIS_HOST: ${{ vars.QIYU_REDIS_HOST }}
          QIYU_REDIS_PORT: ${{ vars.QIYU_REDIS_PORT }}
          QIYU_REDIS_PASSWORD: ${{ secrets.QIYU_REDIS_PASSWORD }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
          QIYU_MINIO_ENABLED: ${{ vars.QIYU_MINIO_ENABLED }}
          QIYU_MINIO_ENDPOINT: ${{ vars.QIYU_MINIO_ENDPOINT }}
          QIYU_MINIO_ACCESS_KEY: ${{ secrets.QIYU_MINIO_ACCESS_KEY }}
          QIYU_MINIO_SECRET_KEY: ${{ secrets.QIYU_MINIO_SECRET_KEY }}
          QIYU_MINIO_BUCKET: ${{ vars.QIYU_MINIO_BUCKET }}
          QIYU_MINIO_PUBLIC_BASE_URL: ${{ vars.QIYU_MINIO_PUBLIC_BASE_URL }}
          QIYU_MINIO_PUBLIC_READ: ${{ vars.QIYU_MINIO_PUBLIC_READ }}
          QIYU_MINIO_SEED_ENABLED: ${{ vars.QIYU_MINIO_SEED_ENABLED }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_FULL_NAME,CONTAINER_NAME,CONTAINER_PORT,HOST_PORT,RESTART_POLICY,HEALTH_TIMEOUT_SECONDS,ACR_DOCKER_REGISTRY,ACR_USERNAME,ACR_PASSWORD,SPRING_PROFILE,QIYU_DB_URL,QIYU_DB_USERNAME,QIYU_DB_PASSWORD,QIYU_REDIS_HOST,QIYU_REDIS_PORT,QIYU_REDIS_PASSWORD,ADMIN_INITIAL_PASSWORD,QIYU_MINIO_ENABLED,QIYU_MINIO_ENDPOINT,QIYU_MINIO_ACCESS_KEY,QIYU_MINIO_SECRET_KEY,QIYU_MINIO_BUCKET,QIYU_MINIO_PUBLIC_BASE_URL,QIYU_MINIO_PUBLIC_READ,QIYU_MINIO_SEED_ENABLED
          script: |
            set -eu
            : "$IMAGE_FULL_NAME"
            : "$QIYU_DB_URL"
            : "$QIYU_DB_USERNAME"
            : "$QIYU_DB_PASSWORD"
            : "$QIYU_REDIS_HOST"
            DOCKER_CONFIG=$(mktemp -d)
            export DOCKER_CONFIG
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            printf '%s' "$ACR_PASSWORD" | docker login --username "$ACR_USERNAME" --password-stdin "$ACR_DOCKER_REGISTRY"
            docker pull "$IMAGE_FULL_NAME"
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart "$RESTART_POLICY" \
              -p "${HOST_PORT:-8080}:$CONTAINER_PORT" \
              -e SPRING_PROFILES_ACTIVE="${SPRING_PROFILE:-db}" \
              -e SERVER_PORT="$CONTAINER_PORT" \
              -e QIYU_DB_URL="$QIYU_DB_URL" \
              -e QIYU_DB_USERNAME="$QIYU_DB_USERNAME" \
              -e QIYU_DB_PASSWORD="$QIYU_DB_PASSWORD" \
              -e SPRING_DATA_REDIS_HOST="$QIYU_REDIS_HOST" \
              -e SPRING_DATA_REDIS_PORT="${QIYU_REDIS_PORT:-6379}" \
              -e SPRING_DATA_REDIS_PASSWORD="${QIYU_REDIS_PASSWORD:-}" \
              -e ADMIN_INITIAL_PASSWORD="${ADMIN_INITIAL_PASSWORD:-}" \
              -e QIYU_BOOKING_PAYMENT_TIMEOUT_MINUTES="${QIYU_BOOKING_PAYMENT_TIMEOUT_MINUTES:-15}" \
              -e QIYU_STORAGE_MINIO_ENABLED="${QIYU_MINIO_ENABLED:-false}" \
              -e QIYU_STORAGE_MINIO_ENDPOINT="${QIYU_MINIO_ENDPOINT:-}" \
              -e QIYU_STORAGE_MINIO_ACCESSKEY="${QIYU_MINIO_ACCESS_KEY:-}" \
              -e QIYU_STORAGE_MINIO_SECRETKEY="${QIYU_MINIO_SECRET_KEY:-}" \
              -e QIYU_STORAGE_MINIO_BUCKET="${QIYU_MINIO_BUCKET:-}" \
              -e QIYU_STORAGE_MINIO_PUBLICBASEURL="${QIYU_MINIO_PUBLIC_BASE_URL:-${QIYU_MINIO_ENDPOINT:-}}" \
              -e QIYU_STORAGE_MINIO_PUBLICREAD="${QIYU_MINIO_PUBLIC_READ:-false}" \
              -e QIYU_STORAGE_MINIO_SEEDENABLED="${QIYU_MINIO_SEED_ENABLED:-false}" \
              "$IMAGE_FULL_NAME"
            deadline=$(( $(date +%s) + HEALTH_TIMEOUT_SECONDS ))
            while :; do
              if [ -n "$(docker ps --filter "name=$CONTAINER_NAME" --filter health=healthy --quiet)" ]; then
                echo "container is healthy"
                break
              fi
              if [ -z "$(docker ps --filter "name=$CONTAINER_NAME" --quiet)" ]; then
                echo "container is not running" >&2
                docker logs --tail 100 "$CONTAINER_NAME" >&2 || true
                exit 1
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "health check timed out after $HEALTH_TIMEOUT_SECONDS seconds" >&2
                docker logs --tail 100 "$CONTAINER_NAME" >&2 || true
                exit 1
              fi
              sleep 5
            done
