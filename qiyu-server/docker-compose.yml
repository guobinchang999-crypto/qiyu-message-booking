# Flow supplies the image and runtime variables; this file contains no credentials.
# Required values are checked by Compose before containers are changed.
services:
  qiyu-server:
    image: "${IMAGE_FULL_NAME:?IMAGE_FULL_NAME is required}"
    container_name: "${CONTAINER_NAME:-qiyu-server}"
    restart: "${RESTART_POLICY:-unless-stopped}"
    ports:
      - "${HOST_PORT:-8080}:${CONTAINER_PORT:-8080}"
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILE:-db}"
      SERVER_PORT: "${CONTAINER_PORT:-8080}"
      QIYU_DB_URL: "${QIYU_DB_URL:?QIYU_DB_URL is required}"
      QIYU_DB_USERNAME: "${QIYU_DB_USERNAME:?QIYU_DB_USERNAME is required}"
      QIYU_DB_PASSWORD: "${QIYU_DB_PASSWORD:?QIYU_DB_PASSWORD is required}"
      SPRING_DATA_REDIS_HOST: "${QIYU_REDIS_HOST:?QIYU_REDIS_HOST is required}"
      SPRING_DATA_REDIS_PORT: "${QIYU_REDIS_PORT:-6379}"
      SPRING_DATA_REDIS_PASSWORD: "${QIYU_REDIS_PASSWORD:-}"
      ADMIN_INITIAL_PASSWORD: "${ADMIN_INITIAL_PASSWORD:-}"
      QIYU_BOOKING_PAYMENT_TIMEOUT_MINUTES: "${QIYU_BOOKING_PAYMENT_TIMEOUT_MINUTES:-15}"
      QIYU_STORAGE_MINIO_ENABLED: "${QIYU_MINIO_ENABLED:-false}"
      QIYU_STORAGE_MINIO_ENDPOINT: "${QIYU_MINIO_ENDPOINT:-}"
      QIYU_STORAGE_MINIO_ACCESSKEY: "${QIYU_MINIO_ACCESS_KEY:-}"
      QIYU_STORAGE_MINIO_SECRETKEY: "${QIYU_MINIO_SECRET_KEY:-}"
      QIYU_STORAGE_MINIO_BUCKET: "${QIYU_MINIO_BUCKET:-}"
      QIYU_STORAGE_MINIO_PUBLICBASEURL: "${QIYU_MINIO_PUBLIC_BASE_URL:-${QIYU_MINIO_ENDPOINT:-}}"
      QIYU_STORAGE_MINIO_PUBLICREAD: "${QIYU_MINIO_PUBLIC_READ:-false}"
      QIYU_STORAGE_MINIO_SEEDENABLED: "${QIYU_MINIO_SEED_ENABLED:-false}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$$SERVER_PORT/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
