# 栖愈后端生产部署编排（自有主机，配合云效 Flow 主机部署任务）
# 用法（在目标服务器上，把密钥通过 CI 密文变量注入而非手工 export）：
#   export QIYU_DB_URL="jdbc:mysql://<host>:3306/qiyu_booking?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
#   export QIYU_DB_USERNAME="<用户>" QIYU_DB_PASSWORD="<密码>"
#   export QIYU_REDIS_HOST="<host>" QIYU_REDIS_PASSWORD="<密码>"
#   export ADMIN_INITIAL_PASSWORD="<首次部署管理员初始密码>"
#   export QIYU_IMAGE_TAG="latest"
#   docker compose up -d
services:
  qiyu-server:
    image: ${QIYU_IMAGE_REPOSITORY:-qiyu-server}:${QIYU_IMAGE_TAG:-latest}
    container_name: qiyu-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: db
      QIYU_DB_URL: ${QIYU_DB_URL}
      QIYU_DB_USERNAME: ${QIYU_DB_USERNAME}
      QIYU_DB_PASSWORD: ${QIYU_DB_PASSWORD}
      QIYU_REDIS_HOST: ${QIYU_REDIS_HOST:-127.0.0.1}
      QIYU_REDIS_PORT: ${QIYU_REDIS_PORT:-6379}
      QIYU_REDIS_PASSWORD: ${QIYU_REDIS_PASSWORD:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      QIYU_BOOKING_PAYMENT_TIMEOUT_MINUTES: ${QIYU_BOOKING_PAYMENT_TIMEOUT_MINUTES:-15}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
