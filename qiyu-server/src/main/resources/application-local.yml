spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${QIYU_LOCAL_DB_URL:jdbc:mysql://192.168.31.100:3306/qiyu_booking?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${QIYU_LOCAL_DB_USERNAME:root}
    password: ${QIYU_LOCAL_DB_PASSWORD:${QIYU_DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/flyway
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  data:
    redis:
      host: ${QIYU_LOCAL_REDIS_HOST:192.168.31.100}
      port: ${QIYU_LOCAL_REDIS_PORT:6379}
      password: ${QIYU_LOCAL_REDIS_PASSWORD:${QIYU_REDIS_PASSWORD:}}
      timeout: 3s

qiyu:
  auth:
    persistence: true
  storage:
    minio:
      enabled: ${QIYU_LOCAL_MINIO_ENABLED:false}
      endpoint: ${QIYU_LOCAL_MINIO_ENDPOINT:http://192.168.31.100:9000}
      console-endpoint: ${QIYU_LOCAL_MINIO_CONSOLE_ENDPOINT:http://192.168.31.100:9001}
      access-key: ${QIYU_LOCAL_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${QIYU_LOCAL_MINIO_SECRET_KEY:}
      bucket: ${QIYU_LOCAL_MINIO_BUCKET:qiyu-local}
      public-base-url: ${QIYU_LOCAL_MINIO_PUBLIC_BASE_URL:http://192.168.31.100:9000}
      seed-enabled: ${QIYU_LOCAL_MINIO_SEED_ENABLED:false}
