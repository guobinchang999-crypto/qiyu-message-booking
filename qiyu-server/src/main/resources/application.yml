server:
  port: 8080

spring:
  application:
    name: qiyu-server
  datasource:
    url: jdbc:h2:mem:qiyu_mock;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false

springdoc:
  swagger-ui:
    path: /doc.html

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  is-concurrent: false
  is-share: false
  is-log: false

qiyu:
  auth:
    mock-admin-password: ${QIYU_ADMIN_INITIAL_PASSWORD:123456}
    persistence: false
