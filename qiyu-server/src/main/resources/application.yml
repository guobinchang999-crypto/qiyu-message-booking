server:
  port: 8080

spring:
  application:
    name: qiyu-server
  profiles:
    default: local
  autoconfigure:
    exclude:
      - cn.dev33.satoken.dao.SaTokenDaoRedisJackson

springdoc:
  swagger-ui:
    path: /doc.html

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  is-concurrent: false
  is-share: false
  is-log: false

qiyu:
  auth:
    admin-session-timeout-seconds: ${QIYU_ADMIN_SESSION_TIMEOUT_SECONDS:43200}
  booking:
    payment-timeout-minutes: ${QIYU_BOOKING_PAYMENT_TIMEOUT_MINUTES:15}
    payment-release-interval-ms: ${QIYU_BOOKING_PAYMENT_RELEASE_INTERVAL_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
