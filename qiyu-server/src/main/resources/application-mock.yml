spring:
  config:
    activate:
      on-profile: mock
  datasource:
    url: jdbc:h2:mem:qiyu_mock;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false

qiyu:
  auth:
    mock-admin-password: ${QIYU_ADMIN_INITIAL_PASSWORD:123456}
    persistence: false
